[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopsy"
version = "0.1.0"
description = "Local strategy research with reference accounting and honesty checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "pyarrow", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
oracle = ["gymnasium"]

[project.scripts]
autopsy = "autopsy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
